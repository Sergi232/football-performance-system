<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d4858"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}.sub{font:400 18px Arial,sans-serif;fill:#516074}
      .master{fill:#eef4ff;stroke:#315c9e;stroke-width:2;rx:12}.raw{fill:#f8f8fb;stroke:#50596b;stroke-width:2;rx:12}.derived{fill:#eef9f2;stroke:#2d7a4f;stroke-width:2;rx:12}.decision{fill:#fff6e8;stroke:#a96614;stroke-width:2;rx:12}
      .label{font:700 17px Arial,sans-serif;fill:#172033;text-anchor:middle}.small{font:400 13px Arial,sans-serif;fill:#4f5f72;text-anchor:middle}
      .arrow{stroke:#3d4858;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#8792a3;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .legend{font:700 14px Arial,sans-serif;fill:#172033}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fff"/>
  <text x="70" y="60" class="title">Modelo de datos simplificado</text>
  <text x="70" y="94" class="sub">Separación entre entidades maestras, observaciones raw, variables derivadas y decisiones</text>

  <rect x="70" y="150" width="180" height="72" class="master"/><text x="160" y="180" class="label">teams</text><text x="160" y="204" class="small">equipo</text>
  <rect x="300" y="150" width="180" height="72" class="master"/><text x="390" y="180" class="label">players</text><text x="390" y="204" class="small">jugador</text>
  <rect x="530" y="150" width="180" height="72" class="master"/><text x="620" y="180" class="label">matches</text><text x="620" y="204" class="small">partido</text>

  <rect x="180" y="305" width="210" height="82" class="raw"/><text x="285" y="338" class="label">player_match</text><text x="285" y="364" class="small">unidad analítica</text>
  <rect x="455" y="305" width="210" height="82" class="raw"/><text x="560" y="338" class="label">match_events</text><text x="560" y="364" class="small">eventos observados</text>
  <rect x="730" y="305" width="230" height="82" class="raw"/><text x="845" y="338" class="label">player_match_raw_stats</text><text x="845" y="364" class="small">agregados raw</text>
  <rect x="1025" y="305" width="210" height="82" class="raw"/><text x="1130" y="338" class="label">player_role_stints</text><text x="1130" y="364" class="small">rol observado</text>

  <rect x="180" y="470" width="210" height="82" class="raw"/><text x="285" y="503" class="label">gps_imports</text><text x="285" y="529" class="small">metadatos proveedor</text>
  <rect x="455" y="470" width="210" height="82" class="raw"/><text x="560" y="503" class="label">gps_player_map</text><text x="560" y="529" class="small">mapping explícito</text>
  <rect x="730" y="470" width="230" height="82" class="raw"/><text x="845" y="503" class="label">gps_observations</text><text x="845" y="529" class="small">muestras normalizadas</text>

  <rect x="245" y="645" width="250" height="82" class="derived"/><text x="370" y="678" class="label">player_match_features</text><text x="370" y="704" class="small">features derivadas</text>
  <rect x="610" y="645" width="250" height="82" class="derived"/><text x="735" y="678" class="label">analytics evidence</text><text x="735" y="704" class="small">contexto / tendencia</text>
  <rect x="975" y="645" width="250" height="82" class="decision"/><text x="1100" y="678" class="label">decision_results</text><text x="1100" y="704" class="small">experto N1000–N13000</text>

  <path d="M160 222 C160 260,230 270,285 305" class="arrow"/><path d="M390 222 C390 260,340 275,310 305" class="arrow"/><path d="M620 222 C620 265,430 280,330 305" class="arrow"/>
  <path d="M390 346 L455 346" class="arrow"/><path d="M665 346 L730 346" class="arrow"/><path d="M960 346 L1025 346" class="dash"/>
  <path d="M285 387 C285 430,285 440,285 470" class="dash"/><path d="M390 511 L455 511" class="arrow"/><path d="M665 511 L730 511" class="arrow"/>
  <path d="M845 387 C760 570,560 610,430 645" class="arrow"/><path d="M1130 387 C1040 560,850 605,780 645" class="dash"/>
  <path d="M845 552 C800 600,790 615,770 645" class="arrow"/>
  <path d="M495 686 L610 686" class="arrow"/><path d="M860 686 L975 686" class="arrow"/>

  <rect x="70" y="785" width="24" height="18" class="master"/><text x="105" y="799" class="legend">master</text>
  <rect x="205" y="785" width="24" height="18" class="raw"/><text x="240" y="799" class="legend">raw / normalized</text>
  <rect x="400" y="785" width="24" height="18" class="derived"/><text x="435" y="799" class="legend">derived / analytics</text>
  <rect x="615" y="785" width="24" height="18" class="decision"/><text x="650" y="799" class="legend">decision</text>
</svg>