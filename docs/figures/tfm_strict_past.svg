<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f3b52"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#172033}
      .sub{font:400 18px Arial,sans-serif;fill:#516074}
      .label{font:700 19px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .small{font:400 15px Arial,sans-serif;fill:#4f5f72;text-anchor:middle}
      .past{fill:#eef9f2;stroke:#2d7a4f;stroke-width:2}
      .now{fill:#eef4ff;stroke:#315c9e;stroke-width:3}
      .future{fill:#fff1f1;stroke:#a33a3a;stroke-width:2}
      .line{stroke:#2f3b52;stroke-width:3}
      .ok{stroke:#2d7a4f;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .bad{stroke:#a33a3a;stroke-width:3;stroke-dasharray:9 7;fill:none}
      .cross{stroke:#a33a3a;stroke-width:4}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#fff"/>
  <text x="70" y="62" class="title">Control temporal strict-past</text>
  <text x="70" y="95" class="sub">Para analizar una fila en fecha t solo se utiliza información con fecha estrictamente anterior</text>

  <line x1="120" y1="310" x2="1280" y2="310" class="line"/>

  <rect x="155" y="210" width="170" height="95" rx="14" class="past"/>
  <text x="240" y="247" class="label">Partido t−3</text>
  <text x="240" y="277" class="small">permitido</text>

  <rect x="390" y="210" width="170" height="95" rx="14" class="past"/>
  <text x="475" y="247" class="label">Partido t−2</text>
  <text x="475" y="277" class="small">permitido</text>

  <rect x="625" y="210" width="170" height="95" rx="14" class="past"/>
  <text x="710" y="247" class="label">Partido t−1</text>
  <text x="710" y="277" class="small">permitido</text>

  <rect x="860" y="185" width="190" height="120" rx="14" class="now"/>
  <text x="955" y="232" class="label">Fila actual t</text>
  <text x="955" y="265" class="small">FEATURE / ANALYTICS</text>

  <rect x="1115" y="210" width="170" height="95" rx="14" class="future"/>
  <text x="1200" y="247" class="label">Partido t+1</text>
  <text x="1200" y="277" class="small">prohibido</text>

  <path d="M240 330 C350 430,760 430,930 320" class="ok"/>
  <path d="M475 330 C560 395,780 395,930 320" class="ok"/>
  <path d="M710 330 C770 360,840 350,930 320" class="ok"/>

  <path d="M1200 330 C1140 390,1070 385,1005 320" class="bad"/>
  <line x1="1085" y1="355" x2="1120" y2="390" class="cross"/>
  <line x1="1120" y1="355" x2="1085" y2="390" class="cross"/>

  <text x="700" y="500" class="sub" text-anchor="middle">También se evita que dos partidos de la misma fecha se informen mutuamente.</text>
</svg>