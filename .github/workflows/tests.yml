name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FPS_DEMO_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit and contract tests
        run: pytest -q

      - name: Build and validate synthetic public demo
        run: python -m publication.validate_synthetic_demo --rebuild

      - name: Validate Coach Copilot query-space contract
        run: python -m llm.validate_coach_contract --db data/football_performance_synthetic_demo.duckdb
