name: tests

# Durante el desarrollo los tests automáticos por push están desactivados para
# evitar notificaciones repetitivas. Rehabilitar push/pull_request antes de la
# publicación final del repositorio.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q
